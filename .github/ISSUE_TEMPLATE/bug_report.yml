name: Bug report
description: Something broken in the demo or dev setup
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include steps to reproduce and browser/OS if UI-related.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open live demo\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
